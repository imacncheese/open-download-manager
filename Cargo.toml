[workspace]
resolver = "2"
members = ["crates/odm-core", "crates/odm-app", "crates/odm-host"]

[workspace.package]
version = "1.0.11"
edition = "2021"
authors = ["Open Download Manager contributors"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "net", "process"] }
reqwest = { version = "0.12", features = ["stream", "gzip", "brotli", "deflate", "cookies", "socks"] }
futures-util = "0.3"
url = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
percent-encoding = "2"
httpdate = "1"
base64 = "0.22"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
